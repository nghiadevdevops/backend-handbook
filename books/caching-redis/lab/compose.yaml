# Lab "Caching chuyên sâu với Redis/Valkey". Không map port ra host.
# Chạy:  docker compose -p bookcheck-cache up -d
# Dọn:   docker compose -p bookcheck-cache down -v
name: bookcheck-cache
services:
  pg:
    image: postgres:18-alpine
    container_name: bookcheck-cache-pg
    command: ["postgres", "-c", "max_connections=200", "-c", "fsync=off"]
    environment: { POSTGRES_PASSWORD: lab, POSTGRES_DB: shop }
    mem_limit: 256m
    networks: [net]
  valkey:
    image: valkey/valkey:9.1.3-alpine
    container_name: bookcheck-cache-valkey
    mem_limit: 128m
    networks: [net]
  redis:
    image: redis:8.10.3-alpine
    container_name: bookcheck-cache-redis
    mem_limit: 128m
    networks: [net]
  client:
    image: postgres:18-alpine     # có psql và nc (busybox) để nói RESP inline
    container_name: bookcheck-cache-client
    entrypoint: ["sleep", "3600"]
    environment: { PGHOST: bookcheck-cache-pg, PGUSER: postgres, PGPASSWORD: lab, PGDATABASE: shop }
    volumes: ["./:/lab:ro"]
    mem_limit: 128m
    networks: [net]
  go:
    image: golang:1.27.3-alpine
    container_name: bookcheck-cache-go
    entrypoint: ["sleep", "3600"]
    working_dir: /app
    environment:
      DATABASE_URL: postgres://postgres:lab@bookcheck-cache-pg/shop
      CACHE_ADDR: bookcheck-cache-valkey:6379
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomod
    volumes: ["./go:/app"]
    mem_limit: 768m
    networks: [net]
  node:
    image: node:26-alpine
    container_name: bookcheck-cache-node
    entrypoint: ["sleep", "3600"]
    working_dir: /app
    environment:
      REDIS_URL: redis://bookcheck-cache-valkey:6379
      HOME: /tmp
      npm_config_cache: /tmp/npm
    volumes: ["./node:/app"]
    mem_limit: 512m
    networks: [net]
networks:
  net: { name: bookcheck-cache-net }
